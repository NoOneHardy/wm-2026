name: 'Publish docker image'
author: no1ha
description: 'Publishes the docker image to https://docker.no1hardy.ch'
inputs:
  project:
    description: 'The project of the image that is published'
    required: true
  registry_username:
    description: 'Docker registry username'
    required: true
  registry_password:
    description: 'Docker registry password or token'
    required: true
runs:
  using: composite
  steps:
    - name: 'Log in to Docker registry'
      uses: docker/login-action@v2
      with:
        registry: docker.no1hardy.ch
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}
    - name: 'Get current date'
      shell: bash
      run: echo "NOW=$(date +'%y-%m-%d')" >> $GITHUB_ENV
    - name: 'Get image tag'
      shell: bash
      run: echo "TAG=${{ env.NOW }}-$( echo '${{ github.sha }}' | cut -c 1-7 )" >> $GITHUB_ENV
    - name: 'Tag docker image (latest)'
      shell: bash
      run: docker tag wm-2026-${{ inputs.project }} docker.no1hardy.ch/wm-2026-${{ inputs.project }}:latest
    - name: 'Tag docker image (version)'
      shell: bash
      run: docker tag wm-2026-${{ inputs.project }} docker.no1hardy.ch/wm-2026-${{ inputs.project }}:${{ env.TAG }}
    - name: 'Push docker image'
      shell: bash
      run: |
        docker push docker.no1hardy.ch/wm-2026-${{ inputs.project }}:${{ env.TAG }}
        docker push docker.no1hardy.ch/wm-2026-${{ inputs.project }}:latest
