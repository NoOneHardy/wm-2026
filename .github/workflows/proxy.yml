name: Proxy
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            proxy
      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3
      - name: 'Log in to docker registry'
        uses: docker/login-action@v3
        with:
          registry: docker.no1hardy.ch
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
      - name: 'Collect image metadata'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.no1hardy.ch/${{ github.repository }}/proxy
          tags: |
            type=ref,event=branch
            type=sha
      - name: 'Build image (push on develop)'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: proxy/Dockerfile
          push: ${{ github.ref == 'refs/head/develop' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max