name: Service
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 'Install Java'
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            service
            gradle
      - name: 'Java version'
        run: java -version
      - name: 'Get configuration'
        uses: ./.github/actions/load-service-config
        with:
          secret_key: ${{ secrets.SERVICE_CONF_SECRET_KEY }}
          database_host: ${{ secrets.SERVICE_CONF_DATABASE_HOST }}
          database_user: ${{ secrets.SERVICE_CONF_DATABASE_USER }}
          database_pw: ${{ secrets.SERVICE_CONF_DATABASE_PW }}
          smtp_host: ${{ secrets.SERVICE_CONF_SMTP_HOST }}
          smtp_port: ${{ secrets.SERVICE_CONF_SMTP_PORT }}
          smtp_user: ${{ secrets.SERVICE_CONF_SMTP_USER }}
          smtp_pw: ${{ secrets.SERVICE_CONF_SMTP_PW }}
          base_url: ${{ secrets.BASE_URL }}
      - name: 'Set up gradle'
        uses: gradle/actions/setup-gradle@v4
      - name: 'Testing'
        run: ./gradlew :service:test
  build:
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            service
            gradle
      - name: 'Get configuration'
        uses: ./.github/actions/load-service-config
        with:
          secret_key: ${{ secrets.SERVICE_CONF_SECRET_KEY }}
          database_host: ${{ secrets.SERVICE_CONF_DATABASE_HOST }}
          database_user: ${{ secrets.SERVICE_CONF_DATABASE_USER }}
          database_pw: ${{ secrets.SERVICE_CONF_DATABASE_PW }}
          smtp_host: ${{ secrets.SERVICE_CONF_SMTP_HOST }}
          smtp_port: ${{ secrets.SERVICE_CONF_SMTP_PORT }}
          smtp_user: ${{ secrets.SERVICE_CONF_SMTP_USER }}
          smtp_pw: ${{ secrets.SERVICE_CONF_SMTP_PW }}
          base_url: ${{ secrets.BASE_URL }}
      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3
      - name: 'Log in to docker registry'
        uses: docker/login-action@v3
        with:
          registry: docker.no1hardy.ch
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
      - name: 'Collect image metadata'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.no1hardy.ch/${{ github.repository }}/service
          tags: |
            type=ref,event=branch
            type=sha
      - name: 'Build image (push on develop)'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          push: ${{ github.ref == 'refs/heads/develop' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=service
          cache-to: type=gha,scope=service,mode=max