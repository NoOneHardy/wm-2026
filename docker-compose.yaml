name: 'wm_dev'
services:
  cdn:
    container_name: 'wm_dev_cdn'
    hostname: 'wm_dev_cdn'
    image: nginx
    volumes:
      - './storage:/usr/share/nginx/html:ro'
    restart: unless-stopped
  frontend:
    container_name: 'wm_dev_frontend'
    hostname: 'wm_dev_frontend'
    build:
      dockerfile: './frontend/Dockerfile'
      context: .
      target: setup
    volumes:
      - './frontend:/app'
      - 'nm_frontend:/app/node_modules'
    ports:
      - '4200:4200'
      - '9876:9876'
    restart: unless-stopped
    working_dir: '/app'
    entrypoint: ['npm', 'run', 'start']
volumes:
  nm_frontend:
    name: wm_dev_frontend_node_modules