name: 'wm-dev'
services:
  cdn:
    container_name: 'wm-dev-cdn'
    hostname: 'wm-dev-cdn'
    image: nginx
    volumes:
      - './storage:/usr/share/nginx/html:ro'
    restart: unless-stopped
  frontend:
    container_name: 'wm-dev-frontend'
    hostname: 'wm-dev-frontend'
    build:
      dockerfile: './frontend/Dockerfile'
      context: .
      target: setup
    volumes:
      - './frontend:/app'
      - 'nm-frontend:/app/node_modules'
    ports:
      - '4200:4200'
      - '9876:9876'
    restart: unless-stopped
    working_dir: '/app'
    entrypoint: ['npm', 'run', 'start']
  mysql:
    container_name: 'wm-dev-mysql'
    hostname: 'wm-dev-mysql'
    image: mysql:8.3.0
    ports:
      - '26006:3306'
    volumes:
      - 'mysql-data:/var/lib/mysql'
    env_file:
      - './data/.env'
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: true
      MYSQL_DATABASE: wm
    restart: unless-stopped
volumes:
  nm-frontend:
    name: wm-dev-frontend-node-modules
  mysql-data:
    name: wm-dev-mysql-data