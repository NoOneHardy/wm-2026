name: 'wm_dev'
services:
  cdn:
    container_name: 'wm_dev_cdn'
    hostname: 'wm_dev_cdn'
    image: nginx
    volumes:
      - './storage:/usr/share/nginx/html:ro'
    restart: unless-stopped
  frontend:
    container_name: 'wm_dev_frontend'
    hostname: 'wm_dev_frontend'
    build:
      dockerfile: './frontend/Dockerfile'
      context: .
      target: setup
    volumes:
      - './frontend:/app'
      - 'nm_frontend:/app/node_modules'
    ports:
      - '4200:4200'
      - '9876:9876'
    restart: unless-stopped
    working_dir: '/app'
    entrypoint: ['npm', 'run', 'start']
  mysql:
    container_name: 'wm_dev_mysql'
    hostname: 'wm_dev_mysql'
    image: mysql:8.3.0
    ports:
      - '26006:3306'
    volumes:
      - 'mysql_data:/var/lib/mysql'
    env_file:
      - './data/.env'
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: true
      MYSQL_DATABASE: wm
    restart: unless-stopped
volumes:
  nm_frontend:
    name: wm_dev_frontend_node_modules
  mysql_data:
    name: wm_dev_mysql_data