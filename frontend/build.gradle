plugins {
  id 'base'
  id 'com.github.node-gradle.node' version '7.1.0'
}

node {
  download.set(true)
  version.set("24.18.0")
  pnpmVersion.set("11.9.0")
}

tasks.register('lint', PnpmTask) {
  description 'Lints project'
  group 'lifecycle'
  dependsOn pnpmInstall
  args = ['run', 'lint']
}

tasks.register('test', PnpmTask) {
  description 'Run unit tests'
  group 'lifecycle'
  dependsOn pnpmInstall
  args = ['run', 'test-ci']
}

tasks.register('ngBuild', PnpmTask) {
  description 'Build frontend'
  group 'lifecycle'
  dependsOn pnpmInstall
  args = ['run', 'build']
}
