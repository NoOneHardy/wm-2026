<div class="leaderboard">
  <h1>Rangliste</h1>
  @if (isLoading()) {
    <p class="sub-heading">Wird geladen...</p>
    <div class="loader-wrapper">
      <wm-spinner/>
    </div>
  } @else {
    <p class="sub-heading">Du bist nicht aufgestiegen!</p>
    <div class="board">
      @if (leaderboard().length === 0) {
        <wm-position [ranking]="{
      ranking: 1,
      username: 'Es sind noch keine Spieler in der Rangliste',
      prevRanking: 1,
      avatar: null,
      points: 0,
      id: ''
      }"/>
      }
      @for (ranking of leaderboard(); track ranking.id) {
        <wm-position
          [ranking]="ranking"
          [class.-sticky]="ranking.id === userPos()?.id"
          [highlight]="ranking.id === userPos()?.id"/>
      }
    </div>
  }
</div>
