<a class="nav-item" [class.gradient-text]="gradient()" [routerLink]="route()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: exact()}"
   tabindex="0" role="navigation"
   (click)="clickEvent.emit()" (touchend)="clickEvent.emit()" (keyup.enter)="clickEvent.emit()"
   (keyup.space)="clickEvent.emit()">
  <span *ngIf="icon() as icon" class="material-symbols-rounded icon">{{ icon }}</span>
  <span class="display-name">{{ displayName() }}</span>
</a>
