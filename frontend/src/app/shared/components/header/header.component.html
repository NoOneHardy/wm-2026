<header class="header">
  <nav class="nav">
    <a routerLink="/" class="home-link">WM 2026</a>
    @if (user()) {
      <wm-nav-item displayName="Dashboard" icon="home" route="/" exact/>
      <wm-nav-item displayName="Mein Tippschein" icon="ballot" route="/bets" (clickEvent)="deselectGroup()"/>
    } @else {
      <wm-nav-item displayName="Home" icon="home" route="/" exact/>
    }
    <wm-nav-item displayName="Rangliste" icon="bookmark_star" route="/ranking"/>

    @if (isAdmin()) {
      <wm-nav-item displayName="Resultate" icon="scoreboard" route="/admin/results"/>
      <wm-nav-item displayName="Teilnehmer" icon="person" route="/admin/users"/>
    }

  </nav>
  <div class="user-actions">
    @if (user(); as user) {
      <wm-user-menu [user]="user"/>
    } @else {
      <wm-user-button route="/login" secondary content="Anmelden"/>
      <wm-user-button route="/signup" content="Registrieren"/>
    }
  </div>
</header>
