<form [formGroup]="formGroup" (ngSubmit)="login()">
  <bet-user-management-panel heading="Anmelden">
    <ng-container wm-content>
      <div class="mdc-layout-grid__inner">
        <mat-form-field class="mdc-layout-grid__cell--span-12">
          <mat-label>Benutzername</mat-label>
          <input matInput formControlName="username">
          <mat-error>Pflichtfeld</mat-error>
        </mat-form-field>

        <mat-form-field class="mdc-layout-grid__cell--span-12">
          <mat-label>Passwort</mat-label>
          <input matInput formControlName="password" type="password">
          <mat-icon matSuffix wmPasswordIcon/>
          <mat-error>Pflichtfeld</mat-error>
        </mat-form-field>
        @if (userError(); as error) {
          <span class="login-error mdc-layout-grid__cell--span-12">{{ error }}</span>
        }
      </div>
    </ng-container>
    <ng-container wm-actions>
      <a routerLink="/forgot-password">Passwort vergessen?</a>
      <bet-button (clickEvent)="login()" submit>Anmelden</bet-button>
    </ng-container>
  </bet-user-management-panel>
</form>
