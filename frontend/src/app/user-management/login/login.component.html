<form [formGroup]="formGroup" (ngSubmit)="login()">
  <wm-user-management-panel heading="Anmelden">
    <ng-container wm-content>
      <mat-form-field>
        <mat-label>Benutzername</mat-label>
        <input matInput formControlName="username" autofocus>
        <mat-error></mat-error>
      </mat-form-field>
      <wm-form-field>
        <label>Username</label>
        <input formControlName="username">
        @if (hasError(formGroup.get('username'), 'required')) {
          <span>Pflichtfeld</span>
        }
      </wm-form-field>

      <wm-form-field>
        <label>Password</label>
        <input formControlName="password" type="password">
        @if (hasError(formGroup.get('password'), 'required')) {
          <span>Pflichtfeld</span>
        }
      </wm-form-field>
      @if (userError(); as error) {
        <span class="login-error">{{error}}</span>
      }
    </ng-container>
    <ng-container wm-actions>
      <a routerLink="/forgot-password">Passwort vergessen?</a>
      <wm-button (clickEvent)="login()" submit>Anmelden</wm-button>
    </ng-container>
  </wm-user-management-panel>
</form>
