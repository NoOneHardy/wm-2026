[versions]
java = "25"

node-version = "24.18.0"
pnpm-version = "11.9.0"
node-gradle = "7.1.0"

spring-boot = "4.0.7"
spring-dependency-management = "1.1.7"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"
jjwt = "0.12.6"
mail = "2.0.2"
slf4j = "2.0.13"

[plugins]
spring-boot = {id = 'org.springframework.boot', version.ref = "spring-boot"}
spring-dependency-management = {id = 'io.spring.dependency-management', version.ref = "spring-dependency-management"}
node-gradle = {id = 'com.github.node-gradle.node', version.ref = "node-gradle"}

[libraries]
spring-boot-starter-web = {module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = {module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = {module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = {module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = {module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-test = {module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
spring-security-test = {module = "org.springframework.security:spring-security-test" }
spring-boot-data-jpa-test = { module = "org.springframework.boot:spring-boot-data-jpa-test" }

mysql-connector = {module = "com.mysql:mysql-connector-j"}
h2 = {module = "com.h2database:h2"}

lombok = {module = "org.projectlombok:lombok" }

slf4j-api = {module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

io-jsonwebtoken-jjwt-api = {module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
io-jsonwebtoken-jjwt-impl = {module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
io-jsonwebtoken-jjwt-jackson = {module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

mapstruct = {module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = {module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = {module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }

jakarta-mail = {module = "com.sun.mail:jakarta.mail", version.ref = "mail" }

